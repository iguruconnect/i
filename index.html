<style id="gc-final-card-ui">
/* Exact 6cm Width and 4cm Height Profile Cards */
.gc-profile-card{
    font-family:"Roboto",sans-serif!important;
    position:relative;
    overflow:hidden;
    width:6cm!important;
    height:4cm!important;
    max-width:100%!important;
    border-radius:10px!important;
    padding:5px 6px!important;
    display:flex!important;
    flex-direction:column!important;
    justify-content:space-between!important;
    box-shadow:0 4px 12px rgba(15,23,42,.15);
    background:#fff!important;
    color:#0F172A!important;
    margin:0 auto;
}
.gc-verified-card{border:1.2px solid #2563EB!important}
.gc-registered-card{border:1.2px solid #F97316!important}
.gc-student-card{border:1.2px solid #16A34A!important}

.gc-card-dots{position:absolute;inset:0;opacity:.15;background-image:radial-gradient(circle,#fff 1px,transparent 1.4px);background-size:13px 13px;pointer-events:none}
.gc-card-orbit{position:absolute;border:1px solid rgba(255,255,255,.18);border-radius:50%;pointer-events:none}
.gc-orbit-a{width:300px;height:120px;right:-100px;top:40px;transform:rotate(-8deg);pointer-events:none}
.gc-orbit-b{width:320px;height:140px;left:-120px;top:50px;transform:rotate(-13deg);pointer-events:none}

.gc-card-brand{
    display:flex;
    align-items:center;
    justify-content:center;
    height:14px;
    margin-bottom:1px;
}
.gc-card-brand img{
    width:68px;
    height:13px;
    object-fit:contain;
}

.gc-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1px;position:relative;z-index:3}
.gc-role-pill{display:inline-flex;align-items:center;gap:3px;background:#fff;border:1px solid currentColor;border-radius:3px;padding:1px 3px;font-weight:900;font-size:6.5px;line-height:1}
.gc-indigo-pill{color:#2563EB}
.gc-sky-pill{color:#F97316}
.gc-purple-pill{color:#16A34A}
.gc-role-icon{font-size:6.5px}
.gc-card-code{font-size:5.5px;font-weight:900;color:#64748b}

.gc-chip-row{display:flex;justify-content:space-between;align-items:center;height:12px;margin-bottom:1px;position:relative;z-index:3}
.gc-chip{width:16px;height:11px;border-radius:2px;background:linear-gradient(135deg,#fff3a4,#e4b33a 38%,#ffe782 60%,#ca921a);border:1px solid #e5b52d}
.gc-contactless{font-size:10px;color:#0F172A;transform:rotate(90deg)}

.gc-identity-row{
    display:flex;
    align-items:center;
    gap:5px;
    margin-bottom:3px;
    position:relative;
    z-index:4;
}
.gc-photo-wrap{
    width:28px;
    height:28px;
    border-radius:50%;
    background:#f1f5f9;
    padding:1px;
    flex-shrink:0;
    overflow:hidden;
    border:1px solid #e2e8f0;
}
.gc-photo-wrap img, .gc-photo-wrap span{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:9px;
}
.gc-name-area{flex-grow:1; min-width:0;}
.gc-name-patch{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:2px;
    padding:1px 3px;
    border-radius:3px;
    background:#fff;
    border:1px solid #e2e8f0;
}
.gc-name-patch h3{
    margin:0;
    font-size:9px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    color:#0F172A!important;
}
.gc-blue-tick{width:10px;height:10px;object-fit:contain;flex:none}
.gc-subtitle{font-size:5.5px;font-weight:700;color:#64748b;margin-top:1px;padding-left:1px}

.gc-info-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:2px;
    margin-bottom:3px;
    position:relative;
    z-index:3;
}
.gc-info-box{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:3px;
    padding:2px 3px;
    display:flex;
    flex-direction:column;
}
.gc-info-box small{font-size:4.5px;font-weight:700;color:#64748b;text-transform:uppercase}
.gc-info-box strong{font-size:7px;font-weight:900;color:#0F172A;margin-top:1px}

.gc-rating-strip{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:3px;
    padding:2px 5px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:3px;
    font-size:7px;
    font-weight:700;
    color:#0F172A;
    position:relative;
    z-index:3;
}

.gc-subject-box{
    background:#fff;
    border:1px solid #bfdbfe;
    border-radius:3px;
    padding:3px 5px;
    text-align:center;
    margin-bottom:4px;
    position:relative;
    z-index:3;
}
.gc-student-card .gc-subject-box{border-color:#bbf7d0}
.gc-registered-card .gc-subject-box{border-color:#fed7aa}

.gc-subject-box small{display:block;font-size:4.5px;font-weight:700;text-transform:uppercase;color:#64748b}
.gc-subject-box strong{display:block;font-size:7.5px;font-weight:900;margin-top:1px;color:#2563EB}
.gc-student-card .gc-subject-box strong{color:#16A34A}
.gc-registered-card .gc-subject-box strong{color:#F97316}

.gc-action-row{
    position:relative;
    z-index:10;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:2px;
    margin-top:auto;
    pointer-events:auto;
}
.gc-view-btn,.gc-connect-btn{
    border:0;
    border-radius:3px;
    font-family:inherit;
    font-size:7px;
    font-weight:900;
    padding:3px 2px;
    min-height:18px;
    cursor:pointer;
    transition:.15s;
    text-align:center;
    pointer-events:auto;
    position:relative;
    z-index:11;
}
.gc-view-btn{background:#fff;color:#2563EB;border:1px solid #93c5fd}
.gc-connect-btn{background:#2563EB;color:#fff}
.gc-registered-card .gc-view-btn{color:#F97316;border-color:#fdba74}
.gc-registered-card .gc-connect-btn{background:#F97316}
.gc-student-card .gc-view-btn{color:#16A34A;border-color:#86efac}
.gc-student-card .gc-connect-btn{background:#16A34A}
</style>
</head>

        <!-- Tutors Section -->

                    <h2 class="text-2xl sm:text-3xl font-black text-brand-dark tracking-tight">Featured Verified Tutors</h2>
