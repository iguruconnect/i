<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Cards</title>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* === Base Layout & Resets === */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card-container {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 800px;
      width: 100%;
    }

    /* === Generic Profile Card Base === */
    .gc-profile-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-radius: 20px;
      padding: 20px;
      width: 320px;
      color: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* === 1. Expanded Name Patch (Both Cards) === */
    .gc-profile-card .gc-name-area {
      width: 100% !important;
      max-width: 100% !important;
      margin-bottom: 8px !important;
    }

    .gc-profile-card .gc-name-patch {
      width: 100% !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
      padding: 6px 14px !important;
      background: #ffffff !important;
      border-radius: 12px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .gc-profile-card .gc-name-patch h3 {
      font-size: 22px !important;
      font-weight: 900 !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      max-width: calc(100% - 30px) !important;
      color: #0f172a !important;
      text-align: center;
    }

    /* === 2. Compact Rating Strip (Tutor Card) === */
    .gc-tutor-card .gc-rating-strip {
      width: 100%;
      min-height: 42px !important;
      height: 42px !important;
      margin-bottom: 8px !important;
      padding: 0 8px !important;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .gc-tutor-card .gc-rating-strip > div {
      display: flex;
      align-items: center;
      padding: 4px 6px !important;
      gap: 4px !important;
    }

    .gc-tutor-card .gc-rating-strip > div > i {
      font-size: 16px !important;
      color: #f59e0b;
    }

    .gc-tutor-card .gc-rating-strip small {
      font-size: 9px !important;
      line-height: 1 !important;
      color: #94a3b8;
      display: block;
    }

    .gc-tutor-card .gc-rating-strip strong {
      font-size: 11px !important;
      margin-top: 1px !important;
      color: #ffffff;
      display: block;
    }

    /* === 3. Reduced Hidden Field with White Patch Display (Student Card) === */
    .gc-student-card .gc-student-contact-strip {
      width: 100%;
      min-height: 32px !important;
      height: 32px !important;
      margin-bottom: 8px !important;
      background: transparent !important;
      border: none !important;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gc-student-card .gc-student-contact-cell {
      background: #ffffff !important;
      border-radius: 8px !important;
      padding: 4px 12px !important;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1) !important;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gc-student-card .gc-student-contact-cell > i,
    .gc-student-card .gc-student-contact-cell small,
    .gc-student-card .gc-student-contact-cell strong {
      color: #0f172a !important;
    }

    .gc-student-card .gc-student-contact-cell small {
      font-size: 7px !important;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .gc-student-card .gc-student-contact-cell strong {
      font-size: 10px !important;
    }
  </style>
</head>
<body>

  <div class="card-container">

    <!-- Tutor Card -->
    <div class="gc-profile-card gc-tutor-card">
      <div class="gc-name-area">
        <div class="gc-name-patch">
          <h3>Alexander Montgomery</h3>
        </div>
      </div>

      <div class="gc-rating-strip">
        <div>
          <i class="fa-solid fa-star"></i>
          <div>
            <small>Rating</small>
            <strong>4.9 / 5.0</strong>
          </div>
        </div>
        <div>
          <i class="fa-solid fa-graduation-cap"></i>
          <div>
            <small>Lessons</small>
            <strong>1,240+</strong>
          </div>
        </div>
      </div>
    </div>

    <!-- Student Card -->
    <div class="gc-profile-card gc-student-card">
      <div class="gc-name-area">
        <div class="gc-name-patch">
          <h3>Samantha Richardson</h3>
        </div>
      </div>

      <div class="gc-student-contact-strip">
        <div class="gc-student-contact-cell">
          <i class="fa-solid fa-envelope"></i>
          <div>
            <small>Status</small>
            <strong>Verified Student</strong>
          </div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
