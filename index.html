<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GURU CONNECT - Elite Tutoring Platform</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

                        brand: {
                            blue: '#2563EB',
                            dark: '#0F172A',
                            lightBg: '#F8FAFC',
                            nagpurOrange: '#F97316'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

            emailjs.init({ publicKey: "LHZ617ZwS3g_2O_w2" });
        })();

<style id="gc-final-card-ui">

.gc-profile-card{font-family:"Aksen","Aksen Condensed","Arial Narrow",Roboto,sans-serif!important;position:relative;overflow:hidden;border-radius:28px;padding:16px 18px 18px;min-height:690px;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(15,23,42,.26);border:1px solid rgba(255,255,255,.28);color:#fff}
.gc-profile-card *{box-sizing:border-box}
.gc-profile-card i{font-family:"Font Awesome 6 Free","Font Awesome 6 Brands"!important}
.gc-verified-card{background:linear-gradient(145deg,#42B8F5 0%,#2196E0 48%,#0878C9 100%)}
.gc-registered-card{background:linear-gradient(145deg,#FF9A1F 0%,#F47700 48%,#D84B00 100%)}
.gc-student-card{background:linear-gradient(145deg,#C4EA72 0%,#9FD84E 48%,#70B52F 100%)}

.gc-card-dots{position:absolute;inset:0;opacity:.15;background-image:radial-gradient(circle,#fff 1px,transparent 1.4px);background-size:13px 13px;pointer-events:none}
.gc-card-orbit{position:absolute;border:1px solid rgba(255,255,255,.18);border-radius:50%;pointer-events:none}
.gc-orbit-a{width:690px;height:290px;right:-285px;top:115px;transform:rotate(-8deg)}
.gc-orbit-b{width:720px;height:310px;left:-370px;top:140px;transform:rotate(-13deg)}

.gc-card-top{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.gc-role-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:28px;padding:7px 15px 7px 9px;font-weight:900;font-size:14px;line-height:1;box-shadow:0 5px 14px rgba(0,0,0,.11)}
.gc-indigo-pill{color:#0878d9}.gc-sky-pill{color:#D84B00}.gc-purple-pill{color:#5D7F2F}
.gc-role-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px}
.gc-indigo-pill .gc-role-icon{color:#0878d9}.gc-sky-pill .gc-role-icon{color:#D84B00}.gc-purple-pill .gc-role-icon{color:#5D7F2F}
.gc-card-code{font-size:14px;font-weight:900;letter-spacing:.02em}

.gc-chip-row{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;height:49px}
.gc-chip{width:74px;height:45px;border-radius:9px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;background:linear-gradient(135deg,#fff3a4,#e4b33a 38%,#ffe782 60%,#ca921a);border:1px solid #e5b52d;box-shadow:0 5px 12px rgba(0,0,0,.15);overflow:hidden}
.gc-chip span{border:1px solid rgba(112,78,0,.35)}
.gc-chip span:nth-child(1){border-left:0;border-top:0}.gc-chip span:nth-child(2){border-right:0;border-top:0}.gc-chip span:nth-child(3){border-left:0;border-bottom:0}.gc-chip span:nth-child(4){border-right:0;border-bottom:0}
.gc-contactless{font-size:38px;transform:rotate(90deg);margin-right:5px}

.gc-photo-wrap{position:relative;z-index:4;width:142px;height:142px;border-radius:50%;background:#fff;padding:7px;margin:0 auto 10px;box-shadow:0 5px 18px rgba(0,0,0,.2);overflow:hidden}
.gc-photo-wrap>img,.gc-photo-wrap>span{border-radius:50%}

/* --- UPDATED WHITE PATCH & NAME FONT --- */
.gc-name-area{position:relative;z-index:4;text-align:center;margin-bottom:8px;width:100%}
.gc-name-patch{
    display:flex!important;
    align-items:center!important;
    justify-content:center!important;
    gap:6px!important;
    width:100%!important;
    max-width:100%!important;
    padding:6px 10px!important;
    background:#fff!important;
    border-radius:12px!important;
    box-shadow:0 4px 12px rgba(0,0,0,.13)!important;
}
.gc-name-patch h3{
    margin:0!important;
    color:#172c67!important;
    font-size:13px!important; /* Reduced Font Size for full name */
    line-height:1.1!important;
    font-weight:900!important;
    letter-spacing:0!important;
    white-space:nowrap!important;
    overflow:visible!important;
}
.gc-blue-tick{width:16px!important;height:16px!important;object-fit:contain;flex:none}
.gc-subtitle{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;color:#ffdc00;font-size:11px;font-weight:900;white-space:nowrap}
.gc-subtitle span{width:20px;height:2px;background:#ffdc00}

.gc-info-grid{position:relative;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:13px}
.gc-info-box{min-height:94px;border:1px solid rgba(255,255,255,.27);border-radius:17px;background:rgba(255,255,255,.045);display:flex;align-items:center;gap:12px;padding:11px 14px}
.gc-info-icon{width:54px;height:54px;flex:0 0 54px;border-radius:50%;background:#fff;color:#273d9d;display:flex;align-items:center;justify-content:center;font-size:23px}
.gc-info-box small,.gc-rating-strip small{display:block;color:rgba(255,255,255,.72);font-size:14px;font-weight:900;letter-spacing:.03em;line-height:1.05}
.gc-info-box strong{display:block;color:#fff;font-size:21px;font-weight:900;line-height:1.08;margin-top:7px}

/* --- UPDATED RATING BOX (MORE COMPACT) --- */
.gc-rating-strip{
    position:relative;
    z-index:3;
    background:#f5f8fd;
    color:#243b88;
    border-radius:8px!important;
    min-height:28px!important; /* Compact Height */
    display:grid;
    grid-template-columns:1fr 1px 1fr;
    align-items:center;
    margin-bottom:6px!important;
    overflow:hidden;
}
.gc-rating-strip>div{display:flex;align-items:center;gap:4px!important;padding:2px 4px!important;justify-content:center}
.gc-rating-strip>div>i{font-size:11px!important;color:#ffd300}
.gc-rating-strip>div:nth-child(3)>i{color:#283d91;font-size:10px!important}
.gc-rating-strip small{color:#243b88;font-size:5px!important;line-height:1!important}
.gc-rating-strip strong{display:block;font-size:7px!important;font-weight:900;line-height:1!important;margin-top:0!important;white-space:nowrap}
.gc-rating-strip em{font-style:normal;font-size:4.5px!important;color:#586681;font-weight:700}
.gc-rating-strip b{height:18px!important;background:#31468f;width:1px}

.gc-subject-box{position:relative;z-index:3;background:rgba(34,25,82,.28);border:1px solid rgba(255,255,255,.18);border-radius:15px;min-height:92px;text-align:center;padding:13px 16px;margin-bottom:13px}
.gc-subject-box div{display:flex;align-items:center;justify-content:center;gap:10px;color:rgba(255,255,255,.76);font-size:16px;font-weight:900}
.gc-subject-box div i{font-size:24px;color:#fff}
.gc-subject-box>strong{display:block;font-size:23px;font-weight:900;margin-top:4px}

.gc-action-row{position:relative;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.gc-view-btn,.gc-connect-btn{border:0;border-radius:13px;font-family:inherit;font-size:17px;font-weight:900;padding:13px 9px;min-height:56px;cursor:pointer;transition:.15s}
.gc-view-btn{background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.38);color:#fff}
.gc-connect-btn{background:#fff;color:#263b91;box-shadow:0 5px 12px rgba(0,0,0,.13)}
.gc-view-btn:hover,.gc-connect-btn:hover{transform:translateY(-1px)}
.gc-full-connect{width:100%;margin-top:auto}

.gc-verified-card .gc-name-patch{border:1px solid rgba(255,255,255,.95)}
.gc-registered-card .gc-connect-btn{color:#0876d2}
.gc-student-card .gc-connect-btn{color:#5D7F2F}
.gc-student-card .gc-info-icon{color:#5D7F2F}
</style>

<style id="gc-exact-4x6-final">
/* Exact compact card target: 6cm wide x 4cm tall */
.gc-profile-card{
  width:6cm!important; min-width:6cm!important; max-width:6cm!important;
  height:4cm!important; min-height:4cm!important; max-height:4cm!important;
  padding:5px 6px!important; border-radius:10px!important;
  overflow:hidden!important; display:flex!important; flex-direction:column!important;
}
</style>
</head>
