<!-- Staff Login Modal (Customized Metallic Theme) -->
    <div id="staffLoginModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 z-[100]">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full border border-slate-200 relative overflow-hidden">
            
            <!-- Metallic Gradient Header -->
            <div class="bg-gradient-to-r from-[#990000] via-[#CC0000] to-[#003399] p-6 text-center shadow-md">
                <div class="w-12 h-12 bg-white/20 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl font-bold border border-white/30 backdrop-blur-md shadow-inner">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <!-- SLOGAN REMOVED AND HEADING CHANGED TO STAFF LOGIN -->
                <h3 class="text-2xl font-black text-white tracking-tight drop-shadow-md">Staff Login</h3>
            </div>
            
            <form onsubmit="handleStaffLogin(event)" class="p-6 space-y-5">
                <div>
                    <label class="block text-[10px] sm:text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Staff Username *</label>
                    <input type="text" id="staffUserInput" required autocomplete="off" placeholder="Enter Username (e.g. admin)" class="w-full border border-slate-300 rounded-xl p-3.5 text-sm focus:border-[#CC0000] focus:ring-1 focus:ring-[#CC0000] focus:outline-none transition font-medium bg-slate-50">
                </div>
                <div>
                    <label class="block text-[10px] sm:text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Secure Password *</label>
                    <input type="password" id="staffPassInput" required autocomplete="off" placeholder="Enter Password (e.g. admin123)" class="w-full border border-slate-300 rounded-xl p-3.5 text-sm focus:border-[#003399] focus:ring-1 focus:ring-[#003399] focus:outline-none transition font-medium bg-slate-50">
                </div>
                <div class="flex gap-3 pt-3">
                    <button type="button" onclick="closeStaffLoginModal()" class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3.5 rounded-xl text-[10px] sm:text-xs transition">CANCEL</button>
                    <button type="submit" class="w-2/3 bg-gradient-to-r from-[#CC0000] to-[#003399] hover:opacity-90 text-white font-black py-3.5 rounded-xl shadow-lg text-[10px] sm:text-xs tracking-widest transition transform active:scale-95">LOGIN</button>
                </div>
            </form>
        </div>
    </div>
